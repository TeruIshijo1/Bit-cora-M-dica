name: Integration tests (PostgreSQL)

on:
  pull_request:
  workflow_dispatch:

jobs:
  critical-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hes_test
          POSTGRES_PASSWORD: synthetic-tests-only
          POSTGRES_DB: hospital_escandon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hes_test -d hospital_escandon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql://hes_test:synthetic-tests-only@127.0.0.1:5432/hospital_escandon_test
      SECRET_KEY: synthetic-ci-secret-not-for-production
      ALGORITHM: HS256
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Run critical PostgreSQL suite
        run: python -m pytest -q
      - name: Compile backend
        run: python -m compileall -q backend

